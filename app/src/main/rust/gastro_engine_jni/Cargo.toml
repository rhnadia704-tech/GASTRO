[package]
name = "gastro_engine_jni"
version = "2.5.0"
edition = "2021"
authors = ["GASTRO Engineering Core"]
description = "JNI-based Rust low-level library (.so ELF64), .rodata/IOCTL scanner, VNDK bridge & proprietary blob auto-porting engine for GASTROengine"

[lib]
name = "gastro_engine_jni"
crate-type = ["cdylib", "staticlib"]

[dependencies]
jni = { version = "0.21", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
